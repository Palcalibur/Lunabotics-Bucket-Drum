# ============================================================================
# Sequential Multi-Drum Run Queue Configuration
# ============================================================================

batch_settings:
  output_root: "./output"
  save_particle_clouds: true

# Definition pool of physical PLA bucket drums
drums:
  - id: "open_section_drum"
    obj_path: "assets/bucekt drums/open_section_drum.obj"
    drum_length: 0.20
    outer_radius: 0.18
    scoop_opening: 0.02
    inner_cavity_radius: 0.16

  - id: ""
    obj_path: "assets/bucekt drums/"
    drum_length: 0.35
    outer_radius: 0.18
    scoop_opening: 0.035
    inner_cavity_radius: 0.145

  - id: ""
    obj_path: "assets/drums/"
    drum_length: 0.50
    outer_radius: 0.18
    scoop_opening: 0.05
    inner_cavity_radius: 0.13

# The explicit order queue: Runs are executed from top to bottom
run_queue:
  - run_id: "test_run_01_open_section_drum"
    drum_id: "open_section_drum"
    path:
      start_x: -0.15                   # Where digging begins [m]
      y_offset: 0.0                    # Center track
      cut_depth: 0.03                  # Penetration depth [m] (3 cm)
    kinematics:
      rpm: 20.0
      forward_velocity: 0.04           # v_x [m/s]
      plunge_duration: 0.50            # Time to plunge to cut_depth [s]
