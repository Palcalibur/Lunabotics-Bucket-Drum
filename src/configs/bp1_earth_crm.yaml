# ============================================================================
# BP-1 Lunar Regolith Simulant & Pit Configuration (GPU-Optimized Sizing)
# ============================================================================

environment:
  gravity: [0.0, 0.0, -9.81]           # Earth 1g gravity [m/s^2]

soil_material:
  name: "BP-1 Lunar Regolith Simulant"
  rheology_model: "MU_OF_I"
  bulk_density: 1650.0                 # Bulk density [kg/m^3]
  young_modulus: 1.0e+7                # Elastic modulus [Pa] (10 MPa)
  poisson_ratio: 0.30                  # Poisson's ratio [-]
  cohesion: 1200.0                     # Cohesion c [Pa] (1.2 kPa)
  friction_angle_deg: 42.0             # Internal friction angle [deg]
  mu_s: 0.9004                         # Static friction coeff [-]
  mu_2: 1.1500                         # Dynamic friction coeff [-]
  I_0: 0.04
  average_grain_diameter: 0.0002

sph_discretization:
  # 5 mm spacing keeps particle count ~450k for fast CPU Construct() & 100% GPU utilization.
  # (Lower to 0.0035 only for final high-resolution verification runs)
  initial_spacing: 0.0050              # SPH spacing d_0 [m] (5 mm)
  kernel_multiplier: 1.2
  num_bce_layers: 3
  artificial_viscosity: 0.2
  xsph_coefficient: 0.1
  shifting_method: "PPST_XSPH"

soil_bed:
  # Tighter pit dimensions around the excavation path (~450k particles at d0=5mm)
  dimensions: [1.00, 0.65, 0.16]       # [Length (X), Width (Y), Depth (Z)] in meters
  center: [0.15, 0.0, -0.08]           # Pit center [m] (Top surface at Z = 0.0)
  active_domain_aabb: [0.55, 0.65, 0.45] # Active CUDA domain box around drum [X, Y, Z]

drum_structural:
  material_density: 1240.0             # Solid PLA Density [kg/m^3]
  mesh_swept_sphere_radius: 0.0020
  contact_young_modulus: 3.5e+9        # PLA Young's Modulus [Pa] (3.5 GPa)
  contact_friction: 0.55               # Sliding friction for 3D-printed PLA

simulation:
  dt_cfd: 0.0001                       # SPH step size [s] (1e-4 s)
  dt_mbd: 0.0001                       # Multibody step size [s]
  duration: 5.0                        # Total simulation time [s]
  settling_time: 0.20                  # Initial bed settling before plunge [s]
  output_fps: 60                       # Force/Torque & Trajectory logging rate [Hz]
  particle_export_stride: 6            # Copy SPH cloud from GPU every 6th frame (10 Hz)
